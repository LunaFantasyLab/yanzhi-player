<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>胭脂折扇 Logo（方案 B · 绯红釉光版）</title>
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
    <!-- 更鲜活明艳的东方正胭脂红：红度拉满、零暗沉黑角 -->
    <linearGradient id="baseB" x1="0.04" y1="0.16" x2="0.96" y2="0.86">
      <stop offset="0%" stop-color="#871436"/>
      <stop offset="36%" stop-color="#BA1945"/>
      <stop offset="70%" stop-color="#E11F52"/>
      <stop offset="100%" stop-color="#F43A68"/>
    </linearGradient>
    <!-- 左下温润朱红暗韵（纯红系深调，绝无黑色） -->
    <radialGradient id="lowerLeftRedB" cx="0.16" cy="0.86" r="0.58">
      <stop offset="0%" stop-color="#9B153D" stop-opacity="0.62"/>
      <stop offset="55%" stop-color="#881235" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#881235" stop-opacity="0"/>
    </radialGradient>
    <!-- 左上正红海棠柔光 -->
    <radialGradient id="topLeftRedB" cx="0.24" cy="0.26" r="0.64">
      <stop offset="0%" stop-color="#D4204F" stop-opacity="0.72"/>
      <stop offset="54%" stop-color="#AD1740" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8A1235" stop-opacity="0"/>
    </radialGradient>
    <!-- 右侧明艳红宝石炽光 -->
    <radialGradient id="rubyGlowB" cx="0.84" cy="0.40" r="0.66">
      <stop offset="0%" stop-color="#FF426E" stop-opacity="0.90"/>
      <stop offset="50%" stop-color="#E82454" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#C21846" stop-opacity="0"/>
    </radialGradient>
    <!-- 右下桃花胭脂暖红晕 -->
    <radialGradient id="blushGlowB" cx="0.76" cy="0.82" r="0.56">
      <stop offset="0%" stop-color="#FF8DA8" stop-opacity="0.68"/>
      <stop offset="50%" stop-color="#FF5B82" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#EB2456" stop-opacity="0"/>
    </radialGradient>
    <!-- 釉面斜向清透光泽 -->
    <linearGradient id="glossB" x1="0.10" y1="0.0" x2="0.82" y2="0.88">
      <stop offset="0%" stop-color="#FFF0F4" stop-opacity="0.34"/>
      <stop offset="28%" stop-color="#FFD8E4" stop-opacity="0.12"/>
      <stop offset="68%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#780B29" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="fanShadowB" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#6B0A25" flood-opacity="0.26"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#baseB)"/>
    <rect width="1024" height="1024" fill="url(#lowerLeftRedB)"/>
    <rect width="1024" height="1024" fill="url(#topLeftRedB)"/>
    <rect width="1024" height="1024" fill="url(#rubyGlowB)"/>
    <rect width="1024" height="1024" fill="url(#blushGlowB)"/>
    <rect width="1024" height="1024" fill="url(#glossB)"/>
  </g>
  <g transform="translate(81.92 81.92) scale(860.16)" filter="url(#fanShadowB)">
    <path fill="#FFFDF8" fill-rule="evenodd" d="M 0.1495,0.4598 L 0.6883,0.1000 C 0.8720,0.3351 0.8720,0.6649 0.6883,0.9000 L 0.1495,0.5402 C 0.1361,0.5312 0.1280,0.5161 0.1280,0.5000 C 0.1280,0.4839 0.1361,0.4688 0.1495,0.4598 Z M 0.3902,0.4196 L 0.7245,0.2905 C 0.7308,0.2879 0.7353,0.2820 0.7362,0.2751 C 0.7370,0.2683 0.7342,0.2615 0.7287,0.2573 C 0.7232,0.2532 0.7159,0.2522 0.7095,0.2549 L 0.3834,0.4034 C 0.3805,0.4047 0.3785,0.4073 0.3781,0.4104 C 0.3777,0.4136 0.3790,0.4166 0.3815,0.4185 C 0.3840,0.4204 0.3873,0.4208 0.3902,0.4196 Z M 0.4038,0.4785 L 0.7602,0.4416 C 0.7671,0.4407 0.7729,0.4362 0.7755,0.4298 C 0.7782,0.4234 0.7772,0.4161 0.7730,0.4106 C 0.7688,0.4052 0.7620,0.4024 0.7551,0.4033 L 0.4014,0.4611 C 0.3983,0.4615 0.3957,0.4636 0.3945,0.4665 C 0.3933,0.4694 0.3937,0.4727 0.3956,0.4752 C 0.3976,0.4777 0.4007,0.4789 0.4038,0.4785 Z M 0.4014,0.5389 L 0.7551,0.5967 C 0.7620,0.5976 0.7688,0.5948 0.7730,0.5894 C 0.7772,0.5839 0.7782,0.5766 0.7755,0.5702 C 0.7729,0.5638 0.7671,0.5593 0.7602,0.5584 L 0.4038,0.5215 C 0.4007,0.5211 0.3976,0.5223 0.3956,0.5248 C 0.3937,0.5273 0.3933,0.5306 0.3945,0.5335 C 0.3957,0.5364 0.3983,0.5385 0.4014,0.5389 Z M 0.3834,0.5966 L 0.7095,0.7451 C 0.7159,0.7478 0.7232,0.7468 0.7287,0.7427 C 0.7342,0.7385 0.7370,0.7317 0.7362,0.7249 C 0.7353,0.7180 0.7308,0.7121 0.7245,0.7095 L 0.3902,0.5804 C 0.3873,0.5792 0.3840,0.5796 0.3815,0.5815 C 0.3790,0.5834 0.3777,0.5864 0.3781,0.5896 C 0.3785,0.5927 0.3805,0.5953 0.3834,0.5966 Z"/>
  </g>
</svg>
